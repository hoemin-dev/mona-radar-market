name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-and-collector:
    name: Web and collector
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build web application
        run: npm run build

      - name: Run offline collector tests
        run: npm test

  desktop:
    name: Tauri backend
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Tauri backend
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
